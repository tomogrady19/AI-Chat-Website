<!-- UI Structure and loads styles and JS frontend-->
<!DOCTYPE html>
<html>

<!--browser tab details-->
<head>
    <title>Spotify AI Insights</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='75%25' text-anchor='middle' font-size='90'%3E🎵%3C/text%3E%3C/svg%3E">
</head>

<body>
    <!-- Main page content -->
    <main id="app">
        <h1>Spotify AI Insights</h1>
        <h2 id="subtitle" class="subtitle"></h2>
        <!-- Spotify auth controls -->
        <div id="spotify-auth">
            <button id="spotifyAuthBtn">Loading...</button>
            <button id="spotifySwitchBtn">Switch account</button>
            <a href="/demo">
                <button>Try Demo</button>
            </a>
        </div>
        <div id="mainButtons">
            <div class="control-box">
                <label for="timeRange">Time range:</label>
                <select id="timeRange">
                    <option value="short_term">Last 4 weeks</option>
                    <option value="medium_term" selected>Last 6 months</option>
                    <option value="long_term">All time</option>
                </select>
            </div>
            <div class="control-box now-playing-box">
                <div id="now-playing" aria-live="polite"></div>
                <button id="toggle-play" aria-label="Play or pause">▶</button>
            </div>
        </div>
        <div id="spotify-content">
            <section id="artists-section"></section>
            <section id="tracks-section"></section>
            <section id="recent-section"></section>
        </div>
    </main>

    <!-- Drawer toggle button -->
    <button id="assistant-toggle" aria-label="Open AI assistant">AI Assistant</button>

    <!-- Drawer -->
    <aside id="assistant-drawer" aria-hidden="true">
        <div class="assistant-container">

            <!-- Drawer header -->
            <header class="assistant-header">
              <h2>Ask My AI</h2>
            </header>

            <!-- Chat window -->
            <div id="chat" class="assistant-chat"></div>
            <!-- loading message -->
            <p id="status" class="assistant-status"></p>

            <!-- Input area -->
            <div class="assistant-input">
                <textarea id="userInput" placeholder="Type a question..." rows="3"></textarea>

                <div class="assistant-actions">
                    <button id="recommendButton">Recommend Music</button>
                    <button id="askButton">Ask</button>
                    <button id="clearButton">Clear Chat</button>
                </div>
            </div>

        </div>
    </aside>

    <footer class="site-footer">
        Built by <a href="https://github.com/tomogrady19" target="_blank">Tom O'Grady</a>
    </footer>

    <script type="module">
        import { marked } from "https://cdn.jsdelivr.net/npm/marked@12.0.2/+esm";
        window.marked = marked;
    </script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script> <!--get spotify sdk for in app playback-->
    <script type="module" src="js/main.js"></script>
</body>

</html>
